spring:
  application:
    name: onestop-sacco-backend

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onestop_sacco}
    username: ${DB_USERNAME:onestop}
    password: ${DB_PASSWORD:onestop}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──────────────────────────────────────────────────────────────────────
onestop:
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-long-random-secret-in-production-minimum-256-bits}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  sms:
    provider: ${SMS_PROVIDER:mock}      # mock | africastalking | twilio
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:OneStop}

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ke.onestop.sacco: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
